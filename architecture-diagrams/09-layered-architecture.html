<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensAI — Layered System Workflow</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'JetBrains Mono', monospace; background: #f8fafc; padding: 40px; }
        .container { max-width: 1580px; margin: 0 auto; }
        
        /* SVG Styles */
        .lane { fill: transparent; stroke: #e2e8f0; stroke-width: 1.5; stroke-dasharray: 6,4; rx: 12; }
        .lane-bg { fill: #f8fafc; opacity: 0.5; rx: 12; }
        .lane-txt { font-size: 13px; font-weight: 700; fill: #64748b; }
        
        .box { fill: #ffffff; stroke-width: 1.5; rx: 8; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
        
        .box-client { stroke: #0284c7; }
        .box-auth { stroke: #4f46e5; }
        .box-action { stroke: #059669; }
        .box-api { stroke: #7c3aed; }
        .box-ai { stroke: #e11d48; }
        .box-ext { stroke: #475569; }

        .title { font-size: 11px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
        .sub { font-size: 9px; fill: #64748b; text-anchor: middle; }
        
        .line { fill: none; stroke-width: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-size: 20px; color: #0f172a; margin-bottom: 8px;">Layered Architecture Workflow</h1>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 24px;">Top-down data flow mapped strictly without crossing component boundaries.</p>

        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 900" style="background: white; border: 1px solid #e2e8f0; border-radius: 12px;">
            <defs>
                <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
                </marker>
            </defs>

            <!-- Swimlanes -->
            <g>
                <rect x="20" y="15" width="1540" height="120" class="lane-bg"/><rect x="20" y="15" width="1540" height="120" class="lane"/>
                <text x="35" y="35" class="lane-txt">💻 Client Layer</text>

                <rect x="20" y="155" width="1540" height="120" class="lane-bg"/><rect x="20" y="155" width="1540" height="120" class="lane"/>
                <text x="35" y="175" class="lane-txt">🛡️ Auth Layer</text>

                <rect x="20" y="295" width="1540" height="120" class="lane-bg"/><rect x="20" y="295" width="1540" height="120" class="lane"/>
                <text x="35" y="315" class="lane-txt">⚡ Server Actions (actions/)</text>

                <rect x="20" y="435" width="1540" height="120" class="lane-bg"/><rect x="20" y="435" width="1540" height="120" class="lane"/>
                <text x="35" y="455" class="lane-txt">🌐 API Routes (app/api/)</text>

                <rect x="20" y="575" width="1540" height="120" class="lane-bg"/><rect x="20" y="575" width="1540" height="120" class="lane"/>
                <text x="35" y="595" class="lane-txt">✨ AI Layer</text>

                <rect x="20" y="715" width="1540" height="120" class="lane-bg"/><rect x="20" y="715" width="1540" height="120" class="lane"/>
                <text x="35" y="735" class="lane-txt">☁️ External Services</text>
            </g>

            <!-- Relationship Lines (Carefully segmented to never overlap boxes) -->
            <g>
                <!-- Horizontal Client Sequence -->
                <path d="M 180 85 L 210 85 M 350 85 L 380 85 M 520 85 L 550 85 M 690 85 L 720 85 M 860 85 L 890 85 M 1030 85 L 1060 85 M 1200 85 L 1230 85 M 1370 85 L 1400 85" class="line" stroke="#cbd5e1" marker-end="url(#arrow)"/>
                
                <!-- Auth Line -->
                <line x1="180" y1="225" x2="210" y2="225" class="line" stroke="#4f46e5" marker-end="url(#arrow)"/>

                <!-- Vertical Color Spines (Segmented to avoid boxes completely) -->
                <!-- C1 -->
                <line x1="110" y1="120" x2="110" y2="190" stroke="#0284c7" class="line"/>
                <!-- C2 -->
                <line x1="280" y1="120" x2="280" y2="190" stroke="#6366f1" stroke-dasharray="4,4" class="line"/>
                <line x1="280" y1="260" x2="280" y2="330" stroke="#6366f1" stroke-dasharray="4,4" class="line"/>
                <line x1="280" y1="400" x2="280" y2="750" stroke="#6366f1" stroke-dasharray="4,4" class="line"/>
                <!-- C3 -->
                <line x1="450" y1="120" x2="450" y2="330" stroke="#10b981" stroke-dasharray="4,4" class="line"/>
                <line x1="450" y1="400" x2="450" y2="610" stroke="#10b981" stroke-dasharray="4,4" class="line"/>
                <!-- C4 -->
                <line x1="620" y1="120" x2="620" y2="330" stroke="#0ea5e9" stroke-dasharray="4,4" class="line"/>
                <line x1="620" y1="400" x2="620" y2="470" stroke="#0ea5e9" stroke-dasharray="4,4" class="line"/>
                <line x1="620" y1="540" x2="620" y2="610" stroke="#0ea5e9" stroke-dasharray="4,4" class="line"/>
                <line x1="620" y1="680" x2="620" y2="750" stroke="#0ea5e9" stroke-dasharray="4,4" class="line"/>
                <!-- C5 -->
                <line x1="790" y1="120" x2="790" y2="330" stroke="#ef4444" stroke-dasharray="4,4" class="line"/>
                <line x1="790" y1="400" x2="790" y2="470" stroke="#ef4444" stroke-dasharray="4,4" class="line"/>
                <line x1="790" y1="540" x2="790" y2="610" stroke="#ef4444" stroke-dasharray="4,4" class="line"/>
                <!-- C6 -->
                <line x1="960" y1="120" x2="960" y2="330" stroke="#f59e0b" stroke-dasharray="4,4" class="line"/>
                <!-- C7 -->
                <line x1="1130" y1="120" x2="1130" y2="330" stroke="#3b82f6" stroke-dasharray="4,4" class="line"/>
                <line x1="1130" y1="400" x2="1130" y2="610" stroke="#3b82f6" stroke-dasharray="4,4" class="line"/>
                <!-- C8 -->
                <line x1="1300" y1="120" x2="1300" y2="470" stroke="#8b5cf6" stroke-dasharray="4,4" class="line"/>
                <line x1="1300" y1="540" x2="1300" y2="610" stroke="#8b5cf6" stroke-dasharray="4,4" class="line"/>
                <line x1="1300" y1="680" x2="1300" y2="750" stroke="#8b5cf6" stroke-dasharray="4,4" class="line"/>
                <!-- C9 -->
                <line x1="1470" y1="120" x2="1470" y2="330" stroke="#22c55e" stroke-dasharray="4,4" class="line"/>
                <line x1="1470" y1="400" x2="1470" y2="470" stroke="#22c55e" stroke-dasharray="4,4" class="line"/>
                <line x1="1470" y1="540" x2="1470" y2="610" stroke="#22c55e" stroke-dasharray="4,4" class="line"/>

                <!-- DB Waterfall Routing (Fanned out through column gaps) -->
                <!-- C3 into Gap at 365 -->
                <path d="M 450 400 L 450 415 L 365 415 L 365 710 L 220 710 L 220 750" stroke="#10b981" stroke-dasharray="4,4" class="line"/>
                <!-- C4 into Gap at 535 -->
                <path d="M 620 400 L 620 420 L 535 420 L 535 715 L 230 715 L 230 750" stroke="#0ea5e9" stroke-dasharray="4,4" class="line"/>
                <!-- C5 into Gap at 705 -->
                <path d="M 790 400 L 790 425 L 705 425 L 705 720 L 240 720 L 240 750" stroke="#ef4444" stroke-dasharray="4,4" class="line"/>
                <!-- C6 into Gap at 875 -->
                <path d="M 960 400 L 960 430 L 875 430 L 875 725 L 250 725 L 250 750" stroke="#f59e0b" stroke-dasharray="4,4" class="line"/>
                <!-- C7 into Gap at 1045 -->
                <path d="M 1130 400 L 1130 435 L 1045 435 L 1045 730 L 260 730 L 260 750" stroke="#3b82f6" stroke-dasharray="4,4" class="line"/>
                <!-- C8 into Gap at 1215 -->
                <path d="M 1300 400 L 1300 440 L 1215 440 L 1215 735 L 270 735 L 270 750" stroke="#8b5cf6" stroke-dasharray="4,4" class="line"/>
                <!-- C9 into Gap at 1385 -->
                <path d="M 1470 400 L 1470 445 L 1385 445 L 1385 740 L 280 740 L 280 750" stroke="#22c55e" stroke-dasharray="4,4" class="line"/>

                <!-- Action to AI Routing (Cross connections) -->
                <!-- Cover Letter to Gemini C3 -->
                <path d="M 960 400 L 960 590 L 450 590 L 450 610" stroke="#f59e0b" class="line"/>
                <!-- Quiz to Gemini C6 -->
                <path d="M 1130 400 L 1130 595 L 960 595 L 960 610" stroke="#3b82f6" class="line"/>

                <!-- Extra External Routing -->
                <!-- Analyzer to UploadThing C4 -->
                <path d="M 790 400 L 790 705 L 620 705 L 620 750" stroke="#ef4444" class="line"/>
                <!-- Voice to Deepgram C7 -->
                <path d="M 1300 400 L 1300 710 L 1130 710 L 1130 750" stroke="#8b5cf6" class="line"/>
            </g>

            <!-- ================= Nodes ================= -->
            
            <!-- Layer 1: Client -->
            <g transform="translate(40, 50)"><rect width="140" height="70" class="box box-client"/><text x="70" y="34" class="title">Landing Page</text><text x="70" y="50" class="sub">app/page.js</text></g>
            <g transform="translate(210, 50)"><rect width="140" height="70" class="box box-client"/><text x="70" y="34" class="title">Onboarding</text><text x="70" y="50" class="sub">app/(main)/onboarding</text></g>
            <g transform="translate(380, 50)"><rect width="140" height="70" class="box box-client"/><text x="70" y="34" class="title">Dashboard</text><text x="70" y="50" class="sub">Industry Insights</text></g>
            <g transform="translate(550, 50)"><rect width="140" height="70" class="box box-client"/><text x="70" y="34" class="title">Resume Builder</text><text x="70" y="50" class="sub">Split-Pane Editor</text></g>
            <g transform="translate(720, 50)"><rect width="140" height="70" class="box box-client"/><text x="70" y="34" class="title">Resume Analyzer</text><text x="70" y="50" class="sub">ATS Scoring</text></g>
            <g transform="translate(890, 50)"><rect width="140" height="70" class="box box-client"/><text x="70" y="34" class="title">Cover Letter</text><text x="70" y="50" class="sub">AI Generator</text></g>
            <g transform="translate(1060, 50)"><rect width="140" height="70" class="box box-client"/><text x="70" y="34" class="title">Quiz Practice</text><text x="70" y="50" class="sub">10 MCQs</text></g>
            <g transform="translate(1230, 50)"><rect width="140" height="70" class="box box-client"/><text x="70" y="34" class="title">Voice Interview</text><text x="70" y="50" class="sub">LiveKit WebRTC</text></g>
            <g transform="translate(1400, 50)"><rect width="140" height="70" class="box box-client"/><text x="70" y="34" class="title">Career Roadmap</text><text x="70" y="50" class="sub">ReactFlow Canvas</text></g>

            <!-- Layer 2: Auth -->
            <g transform="translate(40, 190)"><rect width="140" height="70" class="box box-auth"/><text x="70" y="34" class="title">Clerk Auth</text><text x="70" y="50" class="sub">middleware / proxy</text></g>
            <g transform="translate(210, 190)"><rect width="140" height="70" class="box box-auth"/><text x="70" y="34" class="title">checkUser.js</text><text x="70" y="50" class="sub">DB Sync</text></g>

            <!-- Layer 3: Server Actions -->
            <g transform="translate(210, 330)"><rect width="140" height="70" class="box box-action"/><text x="70" y="40" class="title">user.js</text></g>
            <g transform="translate(380, 330)"><rect width="140" height="70" class="box box-action"/><text x="70" y="40" class="title">dashboard.js</text></g>
            <g transform="translate(550, 330)"><rect width="140" height="70" class="box box-action"/><text x="70" y="40" class="title">resume.js</text></g>
            <g transform="translate(720, 330)"><rect width="140" height="70" class="box box-action"/><text x="70" y="40" class="title">resume-analysis</text></g>
            <g transform="translate(890, 330)"><rect width="140" height="70" class="box box-action"/><text x="70" y="40" class="title">cover-letter.js</text></g>
            <g transform="translate(1060, 330)"><rect width="140" height="70" class="box box-action"/><text x="70" y="40" class="title">interview.js</text></g>
            <g transform="translate(1400, 330)"><rect width="140" height="70" class="box box-action"/><text x="70" y="40" class="title">roadmap.js</text></g>

            <!-- Layer 4: API Routes -->
            <g transform="translate(550, 470)"><rect width="140" height="70" class="box box-api"/><text x="70" y="40" class="title">/parse-resume-pdf</text></g>
            <g transform="translate(1230, 470)"><rect width="140" height="70" class="box box-api"/><text x="70" y="40" class="title">/livekit/token</text></g>
            <g transform="translate(1400, 470)"><rect width="140" height="70" class="box box-api"/><text x="70" y="40" class="title">/roadmap/*</text></g>

            <!-- Layer 5: AI Layer -->
            <g transform="translate(380, 610)"><rect width="140" height="70" class="box box-ai"/><text x="70" y="34" class="title">Gemini 2.5</text><text x="70" y="50" class="sub">Flash (Insights)</text></g>
            <g transform="translate(550, 610)"><rect width="140" height="70" class="box box-ai"/><text x="70" y="34" class="title">Gemini 3.1</text><text x="70" y="50" class="sub">Flash Lite (Resume)</text></g>
            <g transform="translate(720, 610)"><rect width="140" height="70" class="box box-ai"/><text x="70" y="34" class="title">Gemini 3.1</text><text x="70" y="50" class="sub">Flash (Analyzer)</text></g>
            <g transform="translate(890, 610)"><rect width="140" height="70" class="box box-ai"/><text x="70" y="34" class="title">Gemini 2.5</text><text x="70" y="50" class="sub">Flash (Quiz)</text></g>
            <g transform="translate(1230, 610)"><rect width="140" height="70" class="box box-ai"/><text x="70" y="34" class="title">GPT-4.1</text><text x="70" y="50" class="sub">mini (Voice)</text></g>
            <g transform="translate(1400, 610)"><rect width="140" height="70" class="box box-ai"/><text x="70" y="34" class="title">Gemini 2.5</text><text x="70" y="50" class="sub">Flash (Roadmap)</text></g>

            <!-- Layer 6: External -->
            <g transform="translate(210, 750)"><rect width="140" height="70" class="box box-ext"/><text x="70" y="40" class="title">Neon PostgreSQL</text></g>
            <g transform="translate(550, 750)"><rect width="140" height="70" class="box box-ext"/><text x="70" y="40" class="title">UploadThing CDN</text></g>
            <g transform="translate(1060, 750)"><rect width="140" height="70" class="box box-ext"/><text x="70" y="34" class="title">Deepgram &amp; Cartesia</text><text x="70" y="50" class="sub">Voice APIs</text></g>
            <g transform="translate(1230, 750)"><rect width="140" height="70" class="box box-ext"/><text x="70" y="40" class="title">LiveKit Cloud</text></g>
            <g transform="translate(1400, 750)"><rect width="140" height="70" class="box box-ext"/><text x="70" y="40" class="title">YouTube API</text></g>

        </svg>
    </div>
</body>
</html>
